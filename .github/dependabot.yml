version: 2

updates:
  # Every action in .github/workflows/ is pinned to a commit SHA, which closes the
  # "a floating tag can move to different code with no diff to review" hole but creates a new one
  # if nothing ever bumps those pins forward: a SHA pinned once and never updated eventually misses
  # real security fixes the action's own maintainers ship. This is what keeps pinning from becoming
  # "pin once, rot forever" — a PR opens automatically the moment a pinned action has a new release,
  # carrying the version bump as an ordinary reviewable diff instead of a silent floating-tag move.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # npm dependencies across the workspace (root manifest covers both packages via workspaces).
  # Minor and patch bumps arrive grouped as one weekly PR so the update stream stays reviewable;
  # major bumps stay individual because they are the ones that actually need a close look.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
