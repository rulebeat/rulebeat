name: Publish image

# Promotes an already-built, already-CI-verified image to :latest/:<version> — it never builds
# from source itself. ci.yml is the one place a Docker image is ever built: on every push to
# main, after typecheck, unit tests, the production build, and the e2e suite all pass, it pushes
# ghcr.io/<owner>/rulebeat:sha-<commit>. This workflow's only job, on a version tag, is to find
# that commit's image, confirm CI actually passed for that exact commit, and retag it with
# `docker buildx imagetools create` — a manifest copy, not a rebuild. That's what makes a released
# version provably the commit CI verified, rather than a second build done at tag time that could
# differ from what was tested.
#
# On a real version tag, the first thing this workflow does is refuse to promote anything if the
# tag disagrees with what package.json/CHANGELOG.md themselves say
# (scripts/verify-release-version.mjs) — even a tag pushed entirely by hand, with no release
# process involved, cannot result in a published image whose version claims disagree with what
# the running app itself reports via Diagnostics -> System (packages/web/lib/version.ts).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish alongside latest (e.g. beta)'
        required: false
        default: ''

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rulebeat

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: read
      # For the cosign "Verify signature" step below — cosign's keyless verify flow also uses
      # OIDC even though this job never signs anything itself.
      id-token: write

    steps:
      # Only a real version tag has a version to verify — workflow_dispatch can also run this
      # workflow from a plain branch (to republish :latest on demand), which "Determine tags"
      # below already treats as version-tag-less by checking the same ref_type.
      - name: Checkout
        if: github.ref_type == 'tag'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.ref_type == 'tag'
        with:
          node-version-file: .nvmrc

      - name: Verify tag matches package.json and CHANGELOG
        if: github.ref_type == 'tag'
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&status=success" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | length')
          if [[ "${COUNT:-0}" -lt 1 ]]; then
            echo "::error::No successful CI run found for commit $SHA — refusing to publish an unverified image. Push $SHA to main (or wait for its CI run to finish) before tagging a release."
            exit 1
          fi
          echo "CI verified for $SHA — promoting ${{ env.IMAGE_NAME }}:sha-${SHA}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Determine tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_NAME }}:latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${VERSION}"
          fi
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Promote CI-verified image to release tags
        run: |
          SOURCE="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          IFS=',' read -ra DEST_TAGS <<< "${{ steps.tags.outputs.tags }}"
          ARGS=()
          for t in "${DEST_TAGS[@]}"; do
            ARGS+=(--tag "$t")
          done
          docker buildx imagetools create "${ARGS[@]}" "$SOURCE"

      # Proves, on every single promotion, that ci.yml's cosign signature really did travel with
      # the retagged image, rather than resting on that as an unverified assumption. Verifies
      # every tag just promoted, not only one — `imagetools create` never
      # rebuilds, so each of them should resolve to the exact digest ci.yml signed; cosign resolves
      # a tag reference to its current digest itself via the registry, the same way `docker pull`
      # would, so this needs no separate digest-extraction step of its own.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signature survived promotion
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IFS=',' read -ra DEST_TAGS <<< "${{ steps.tags.outputs.tags }}"
          for t in "${DEST_TAGS[@]}"; do
            echo "Verifying $t"
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$t"
          done
