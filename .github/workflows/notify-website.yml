# Tells rulebeat/website that public media it mirrors has changed, so its
# sync-content.yml workflow can pull the change and redeploy within minutes.
# No schedule anywhere: the website syncs exactly when this repo produces
# something new, and a quiet week produces zero runs on either side.
#
# One trigger, one event type: a push to main touching the public
# screenshots or the brand kit -> product-content, so the website's synced
# copies stay current.
#
# The release-published dispatch does NOT live here. It used to, behind a
# workflow_run trigger on "Publish image" completing, but that trigger can
# never fire: tag-release.yml starts Publish image with the built-in
# GITHUB_TOKEN, and GitHub's anti-recursion rule stops a GITHUB_TOKEN-started
# run's completion from emitting workflow_run events. It now fires from the
# end of publish-image.yml itself, after promotion succeeds.
#
# Needs the WEBSITE_SYNC_TOKEN Actions secret: a fine-grained PAT with
# access to rulebeat/website only, permission Contents: read and write
# (repository_dispatch requires it). Until the secret exists this workflow
# fails loudly rather than silently doing nothing.
name: Notify website

on:
  push:
    branches: [main]
    paths:
      - 'docs/public/img/**'
      - 'brand/**'

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync to rulebeat/website
        env:
          TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          EVENT_TYPE: product-content
        run: |
          curl -sS --fail -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rulebeat/website/dispatches \
            -d "{\"event_type\":\"$EVENT_TYPE\"}"
