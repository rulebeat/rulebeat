name: Prepare release

# Stage 1 of 2. Runs scripts/release.mjs on a throwaway branch and opens a PR with the exact
# version bump and CHANGELOG diff for review -- nothing is tagged or published here. The local tag
# release.mjs creates is deliberately dropped before anything is pushed, so no image can be
# promoted from this workflow alone. Merging the PR this opens is what authorizes the release;
# tag-release.yml (stage 2) picks it up from there and creates the real tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        # `auto` reads the level off what accumulated in CHANGELOG.md's [Unreleased] section, which
        # is where how-changes-are-made.md already says the bump comes from. An explicit choice
        # still works, but may not go BELOW the level the changelog requires.
        description: Version bump (auto reads it from CHANGELOG.md)
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: write
  # To dispatch CI against the release branch at the end -- a GITHUB_TOKEN-created PR does not
  # reliably get its own workflow runs, so the release branch is given one explicitly.
  actions: write

# Shared with tag-release.yml: never two releases in flight at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Two releases prepared at once would each be generated from a base that does not include the
      # other, so whichever merged second would carry a stale snapshot.
      - name: Refuse if a release PR is already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/v")) | .headRefName] | join(", ")')
          if [[ -n "$OPEN" ]]; then
            echo "::error::A release PR is already open ($OPEN). Merge or close it before preparing another."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        id: release
        run: |
          npm run release -- ${{ inputs.bump }}
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # release.mjs tags the commit it just made. That tag is dropped here, not pushed -- stage 2
      # recreates it only after this PR has been reviewed and merged, so nothing publish-image.yml
      # would act on exists until a human has actually looked at the diff.
      - name: Drop the local tag
        run: git tag -d "v${{ steps.release.outputs.version }}"

      - name: Push release branch
        run: |
          git checkout -b "release/v${{ steps.release.outputs.version }}"
          git push origin "release/v${{ steps.release.outputs.version }}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "release: v${{ steps.release.outputs.version }}" \
            --body "Opened by **Prepare release** (bump: \`${{ inputs.bump }}\`). Merging this PR into \`main\` is what authorizes **Tag release** to tag and publish v${{ steps.release.outputs.version }} -- review the version bump and CHANGELOG diff before merging." \
            --base main \
            --head "release/v${{ steps.release.outputs.version }}"

      # A GITHUB_TOKEN-created PR does not reliably get its own automatic workflow runs (PR #30 for
      # v0.2.1 had zero check runs), so the release branch is given one explicitly. This is early
      # feedback only -- it tests the branch, not the eventual merge commit. tag-release.yml's
      # candidate validation and merge-SHA CI wait remain the authority.
      - name: Dispatch CI against the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "CI" --ref "release/v${{ steps.release.outputs.version }}"

      # Not optional once "Changelog entry" is a required check: a GITHUB_TOKEN-created PR may get
      # no automatic run, which would leave that check permanently "Expected" and make the release
      # PR unmergeable. The gate exempts a valid release PR, but it has to actually run to say so.
      - name: Dispatch PR checks against the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr view "release/v${{ steps.release.outputs.version }}" --json number --jq '.number')
          gh workflow run "PR checks" --ref main -f pr="$PR"
