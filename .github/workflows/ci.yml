name: CI

# Runs on every push and every pull request. The point is that nobody has to remember to run the
# tests — a broken build cannot reach a released image without this failing first.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rulebeat

jobs:
  # Independent of build-and-test below: no npm install, no build, so a secret or a stray
  # internal reference is caught even if the app itself is currently red, and this job's own
  # runtime doesn't grow as the app does.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans git log, not just the working tree; a shallow clone would only ever
          # see the tip commit's diff.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Blocking: a committed secret is a real incident regardless of where else it's caught.
      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --log-opts=--all

      # Non-blocking: see scripts/check-internal-references.sh for why.
      - name: Internal-reference scan
        run: bash scripts/check-internal-references.sh

  build-and-test:
    runs-on: ubuntu-latest
    # Was 15; the Playwright suite (browser install + demo-data generation + 6 specs) adds a few
    # minutes on top of a build that alone runs ~2 minutes on GitHub-hosted runners — this margin
    # is for a cold Chromium/apt-get install on a cache miss, not steady-state runtime. The Docker
    # build and smoke test below adds several more on a cache miss.
    timeout-minutes: 30
    permissions:
      contents: read
      # Only needed for the image-publish step below, which only runs on push to main — a PR
      # build never reaches it, so a fork PR's read-only token is unaffected.
      packages: write
      # For cosign's keyless signing step below — also only reached on push to main.
      id-token: write
      # For uploading the Trivy SARIF scan to the Security tab below — runs on every push and PR.
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` needs better-sqlite3 to build its native addon; ubuntu-latest has the toolchain.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Outside both vitest projects (it's release tooling, not product code, node:test not
      # vitest) so it needs its own step rather than riding along with the line above. Runs on
      # every push, not just at tag time, so a broken checker itself is caught long before it
      # would matter to a real release.
      - name: Test release-version checker
        run: npm run test:release-version

      - name: Test CHANGELOG bump logic
        run: npm run test:release-changelog

      # Runs scripts/release.mjs for real against a scratch fixture repo (see the script's own
      # header): npm's real bump arithmetic, package-lock.json ending up genuinely consistent
      # (checked by running `npm ci` against the result), the git commit and annotated tag, and
      # the dirty-working-tree refusal. The fixture repo gets its own local git identity (the
      # script does this itself), so this needs nothing from the runner's own git config.
      - name: Release script smoke test
        run: bash scripts/release-smoke-test.sh

      # Mirrors the Dockerfile's build steps exactly (core dist, then the Next.js production
      # build) — typecheck and tests both run against source, so neither one catches a build that
      # only breaks once bundled (e.g. a server-only import reaching a client component).
      - name: Build core
        run: npm run build:core

      - name: Build web (production)
        run: npm run build --workspace=packages/web

      # `always()` so the results are kept when the tests fail — which is exactly when they're
      # worth reading. Uses the official upload action; no third-party test reporters, since
      # Vitest's built-in `github-actions` reporter already annotates failures inline.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 30

      # Runs after the production build so the suite's two `next start` servers (packages/web/
      # playwright.config.ts) exercise the exact same build as the rest of this job, not a
      # separately-built one. Cached by Playwright's own version so a routine run skips the
      # download; the cache key changes automatically on a dependency bump.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/web/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: packages/web
        run: npx playwright install --with-deps chromium

      # Synthetic estate, no Azure calls — same fake-data pattern as the rest of the suite.
      - name: Generate demo data
        working-directory: packages/web
        run: npm run generate-demo

      - name: E2E (Playwright)
        working-directory: packages/web
        run: npm run test:e2e

      # Traces (packages/web/playwright.config.ts: `trace: 'retain-on-failure'`) only exist when a
      # test actually failed, so this only fires then — nothing to keep on a green run.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # `npm run lint` is deliberately absent: it currently fails with ~25 pre-existing errors
      # (setState inside effects, non-simple useMemo dependency arrays). Adding it now would make CI
      # red on every run, which trains everyone to ignore it. It gets added once those are cleared.

      # Docker build + smoke test: runs on every push and PR, not just main, so a broken image is
      # caught before it can be tagged and published, not after. scripts/docker-smoke-test.sh
      # executes the exact steps docs/public/install.md documents — build, boot, read the
      # generated password, restart, recreate against the same volume.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: rulebeat:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker smoke test
        run: bash scripts/docker-smoke-test.sh rulebeat:ci-smoke --skip-build

      # Vulnerability scan against the already-built, already-smoke-tested local image — no
      # second build, no repull. Runs on every push and PR, not just main, so a scan
      # result is visible before an image is ever published, not after. Every finding, fixable or
      # not, uploads to the Security tab unconditionally; the separate blocking step below is the
      # only thing that can fail this job, and only on the narrower CRITICAL-with-a-fix condition.
      - name: Scan image for vulnerabilities (Trivy, full results)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rulebeat:ci-smoke
          format: sarif
          output: trivy-results.sarif
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      # Skipped for a fork PR: GitHub forces a fork's token read-only regardless of what this job
      # declares, so this step would otherwise fail loudly on every outside contributor's PR for a
      # permissions reason unrelated to their actual change. The scan and its blocking check above
      # still run either way — only the Security-tab upload needs same-repo write access.
      - name: Upload Trivy results to the Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          sarif_file: trivy-results.sarif

      # Second Trivy invocation, JSON output, feeding the blocking decision below. Two runs rather
      # than reusing the SARIF above: SARIF doesn't carry a clean fixed-version field to filter on,
      # and this keeps "what's visible" (all severities, unconditional) and "what blocks" (a
      # narrower rule) as two genuinely separate concerns instead of one report serving both. Only
      # this invocation reads .trivyignore (via trivyignores:) — a suppression there narrows what
      # can block the build, but the SARIF step above has no trivyignores: input, so anything
      # listed there stays fully visible on the Security tab regardless.
      - name: Scan image for vulnerabilities (Trivy, JSON for the blocking check)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rulebeat:ci-smoke
          format: json
          output: trivy-results.json
          severity: 'CRITICAL'
          exit-code: '0'
          trivyignores: '.trivyignore'

      # The actual blocking gate. Only a CRITICAL finding with a published fix
      # fails the job — nothing with no available fix can ever block a release regardless of
      # severity, and no severity below CRITICAL blocks at all, so an unfixable base-image CVE
      # cannot make CI permanently red the way an unscoped "fail on any finding" rule would.
      - name: Fail on a fixable CRITICAL vulnerability
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and .FixedVersion != null and .FixedVersion != "")] | length' trivy-results.json)
          if [[ "$COUNT" -gt 0 ]]; then
            echo "::error::$COUNT fixable CRITICAL vulnerabilit$([ "$COUNT" -eq 1 ] && echo y || echo ies) found — see the Security tab for detail, or trivy-results.json in this run's logs."
            jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and .FixedVersion != null and .FixedVersion != "")]' trivy-results.json
            exit 1
          fi
          echo "No fixable CRITICAL vulnerabilities."

      # Build-once-promote: the smoke-tested image above is rebuilt with the same cache (so this
      # is a near-instant layer reuse, not a second real build) and pushed by commit SHA — but
      # only for a real push to main, never a PR, whose fork token can't push packages anyway.
      # publish-image.yml never builds from source; it finds this exact image by commit SHA and
      # retags it, so a released version is always provably the commit CI verified, not a second,
      # potentially different build done at tag time.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives OCI labels (source repo, exact revision, build time, license) from git context,
      # fed into the build-push step below rather than baked into the Dockerfile itself, since a
      # git-derived label baked directly into the Dockerfile would invalidate its layer cache on
      # every single commit regardless of what else changed.
      - name: Docker image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=sha-${{ github.sha }}

      - name: Build and push verified image (by commit SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore keyless signing — no private key to create, store, or rotate.
      # The runner's own GitHub Actions OIDC token (id-token: write above) proves "this exact
      # workflow run, in this exact repo, built this," recorded publicly in Sigstore's Rekor
      # transparency log. Signs the digest build-push-action just pushed, not a tag — publish-
      # image.yml's later `docker buildx imagetools create` promotes that same digest under
      # :latest/:<version>, so the signature travels with it automatically; that inheritance is
      # verified for real in publish-image.yml's own "Verify signature" step, not just assumed here.
      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
